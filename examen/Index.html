<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de actividades</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <h1>Gestor de actividades</h1>

  <form id="formulario">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Ej: Limpiar bodega" required>

    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" rows="3" placeholder="Escribe los detalles" required></textarea>

    <label for="estado">Estado</label>
    <select id="estado">
      <option value="Pendiente">Pendiente</option>
      <option value="En proceso">En proceso</option>
      <option value="Terminada">Terminada</option>
    </select>

    <button type="submit">Guardar actividad</button>
  </form>

  <p id="mensaje"></p>

  <h2>Lista de actividades</h2>
  <ul id="lista"></ul>

  <script src="app.js"></script>
</body>
</html>
